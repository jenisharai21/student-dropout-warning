# Render Infrastructure Blueprint Configuration
services:
  # Option 1: Static Site (Recommended for fast CDN hosting)
  - type: web
    name: student-dropout-early-warning-system
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Option 2: Web Service (If backend Node.js execution is required)
  - type: web
    name: student-dropout-warning-server
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
